# CI/CD del frontend en EKS:
#   CI (lint, test, build) -> build imagen (VITE_API_URL = BACKEND_API_URL)
#   -> scan Trivy (gate) -> push a ECR.
# El deployment en el clúster EKS lo gestiona Terraform desde el repo backend;
# este workflow solo publica la imagen :latest que el Deployment de EKS consume.
name: Frontend CI/CD (build + push ECR)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1            # <-- ajusta a tu región
  ECR_REPOSITORY: phoenix-frontend
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  ci:
    name: CI (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Secrets scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vulnerabilidades en dependencias (Trivy fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Lint
        run: npm run lint --if-present

      - name: Tests
        run: npm run test --if-present

      - name: Build de producción (verifica que compile)
        run: npm run build

  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build → Scan (Trivy) → Push a ECR
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar secret BACKEND_API_URL
        run: |
          if [ -z "${{ secrets.BACKEND_API_URL }}" ]; then
            echo "ERROR: secret BACKEND_API_URL no definido."
            echo "Debe contener la URL pública del backend (output backend_url del pipeline Terraform)."
            echo "Ejemplo: a1b2c3d4e5f6.us-east-1.elb.amazonaws.com"
            exit 1
          fi
          echo "BACKEND_API_URL definido: ${{ secrets.BACKEND_API_URL }}"

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag de imagen (SHA corto)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build local (load) para poder ESCANEAR antes de publicar en ECR.
      # VITE_API_URL queda "horneado" en el bundle: el navegador llamará
      # directo al backend por su URL pública (ELB).
      - name: Build imagen (local, para escanear)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/${{ env.ECR_REPOSITORY }}:scan
          build-args: |
            VITE_API_URL=${{ secrets.BACKEND_API_URL }}
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GATE de seguridad: falla el pipeline si hay CVE CRITICAL/HIGH con fix.
      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ env.ECR_REPOSITORY }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      # SBOM: inventario de dependencias como artefacto auditable.
      - name: Generar SBOM (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ env.ECR_REPOSITORY }}:scan
          format: cyclonedx
          output: sbom.cdx.json
      - name: Subir SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # Solo si pasó el scan: reetiqueta y publica a ECR (SHA + latest).
      - name: Push a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker tag local/${ECR_REPOSITORY}:scan  ${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}
          docker tag local/${ECR_REPOSITORY}:scan  ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

      - name: Recordatorio deploy EKS
        run: |
          echo "================================================================"
          echo "   Imagen ${ECR_REPOSITORY}:latest publicada."
          echo "   El Deployment en EKS usa imagePullPolicy: Always."
          echo "   Espera ~1 min y valida http://<frontend_url>"
          echo "   (frontend_url es el output del pipeline Terraform)."
          echo "================================================================"